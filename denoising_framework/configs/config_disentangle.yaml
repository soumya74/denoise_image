experiment:
  name: "disentangle_dual_decoder_sigma25"
  output_dir: "./checkpoints_disentangle"

model:
  name: "disentangle_net"
  params:
    in_channels: 3
    out_channels: 3
    content_dim: 28
    noise_dim: 4

dataset:
  train_dir: "../../CBSD68-dataset/noisy5/train"
  patch_size: 128
  test_split: 0.1

training:
  epochs: 20
  batch_size: 16
  learning_rate: 0.0005
  num_workers: 0

loss_weights:
  clean_rec: 1.0       # L_clean-rec
  noisy_rec: 1.0       # L_noisy-rec
  noise_rec: 1.0       # L_noise-rec
  clean_self: 1.0      # L_clean-self
  content_latent: 0.5  # L_content-latent
  noise_zero: 1.0      # L_noise-zero (forces z_n^x to 0 for clean images)

hardware:
  device: "auto"