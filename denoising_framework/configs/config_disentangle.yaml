experiment:
  name: "disentangle_dual_decoder_sigma25"
  output_dir: "./checkpoints_disentangle"

model:
  name: "disentangle_net"
  params:
    in_channels: 3
    out_channels: 3
    content_dim: 28
    noise_dim: 4

dataset:
  train_dir: "../../CBSD68-dataset/noisy5/train"
  patch_size: 128
  test_split: 0.1

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.0005
  num_workers: 0

loss_weights:
  clean_rec: 1.0       
  noisy_rec: 1.0       
  noise_rec: 2.0       # Slight bump to prioritize noise, but not 15x!
  clean_self: 1.0      
  content_latent: 1.0  # .detach() handles the alignment safely now
  noise_zero: 1.0      
  clean_cross: 1.0

hardware:
  device: "auto"